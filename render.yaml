# Render Blueprint: one free Node web service. Database is external (Neon or Render Postgres):
# paste its connection string into DATABASE_URL when Render asks for it.
services:
  - type: web
    name: xpos
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
